name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The module has no external dependencies and therefore no go.sum, so
          # there is no dependency file to key a build cache on. Re-enabling the
          # cache would add failure modes without adding value.
          cache: false
      - name: Formatting
        # Report the offending files instead of a bare exit code. A whole-tree
        # failure here usually means a CRLF checkout rather than real
        # formatting drift; .gitattributes pins LF to prevent that.
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'gofmt -l reported these unformatted files:\n%s\n' "$unformatted"
            exit 1
          fi
      - run: go test ./... -count=1
      - run: go test -race ./... -count=1
      - run: go vet ./...
      - run: go build ./...
      - name: Dependency contract
        run: test "$(go list -m all)" = github.com/aman-void/portcheck

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      # Report every failing target instead of cancelling the siblings: the
      # point of this matrix is to know which of the six pairs break.
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # No external modules means no go.sum to key a build cache on.
          cache: false
      - name: Build CLI and compile tests
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          mkdir -p bin
          go build -trimpath -o bin/portcheck ./cmd/portcheck
          for package in $(go list ./...); do
            go test -c -o "bin/$(echo "$package" | tr / _).test" "$package"
          done
